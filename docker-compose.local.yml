# Local-only port remap. The committed compose file binds 5432 and 6379, both
# already held by loom's infra stack on this machine.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
networks:
  tier0-net:
    external: true

services:
  orchestrator:
    networks:
      - default
      - tier0-net
  postgres:
    ports: !override
      - "127.0.0.1:15432:5432"
  redis:
    ports: !override
      - "127.0.0.1:16379:6379"
